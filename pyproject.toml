[project]
name = "dtro_security_patrol"
version = "1.0.1"
description = "DTRO 경비순찰 체크리스트"
requires-python = ">=3.10"
dependencies = [
    "flet",
]

[tool.flet]
org = "com.dtro"
product = "DTRO 경비순찰"
# ✅ 앱 아이콘: assets/icon.png 파일 배치 시 자동 인식

[tool.flet.android]
min_sdk_version = 24
permissions = [
    "WRITE_EXTERNAL_STORAGE",
    "READ_EXTERNAL_STORAGE",
]